name: Prettier

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for package.json
        id: check_pkg
        run: |
          if [ -f package.json ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "No package.json found — skipping Prettier"
          fi

      - name: Setup Node.js
        if: steps.check_pkg.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        if: steps.check_pkg.outputs.exists == 'true'
        run: npm install

      - name: Format code with Prettier
        if: steps.check_pkg.outputs.exists == 'true'
        run: npm run format

      - name: Configure Git
        if: steps.check_pkg.outputs.exists == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      # A main exige head atualizado antes do merge, e a regra tambem vale para
      # push: a formatacao vai por PR em auto-merge.
      - name: Commit and open PR
        if: steps.check_pkg.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -n $(git status -s) ]]; then
            git add -A
            git commit -m "style: format code with Prettier"
            BRANCH=automation/prettier
            git checkout -B "$BRANCH"
            git push -f origin "$BRANCH"
            NUM=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
            if [ -z "$NUM" ]; then
              CORPO="Formatacao automatica, gerada pelo workflow Prettier."
              URL=$(gh pr create --base main --head "$BRANCH" --title "style: format code with Prettier" --body "$CORPO")
              NUM="${URL##*/}"
            fi
            gh pr merge "$NUM" --auto --squash
          fi
